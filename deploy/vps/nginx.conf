# LoveOS — Nginx site
# Installed by scripts/deploy.sh vps (placeholders are replaced automatically).
#
#   __DOMAIN__      public domain
#   __APP_DIR__     install directory (frontend/dist + backend/staticfiles)
#   __PORT__        Gunicorn port on 127.0.0.1
#   __ADMIN_PATH__  ADMIN_PATH from backend/.env

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # This is a private world: never let it be indexed.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    client_max_body_size 80M;      # voice notes and songs
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---------------------------------------------------------- frontend (PWA)
    root __APP_DIR__/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached forever; the service worker must not.
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location = /sw.js { add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # ------------------------------------------------------------- backend
    location /api/            { proxy_pass http://127.0.0.1:__PORT__; include proxy_params; proxy_read_timeout 90s; }
    location /__ADMIN_PATH__/ { proxy_pass http://127.0.0.1:__PORT__; include proxy_params; }
    location = /healthz       { proxy_pass http://127.0.0.1:__PORT__; include proxy_params; }
    location = /robots.txt    { proxy_pass http://127.0.0.1:__PORT__; include proxy_params; }

    # Django admin static files
    location /static/ { alias __APP_DIR__/backend/staticfiles/; expires 30d; }

    # NOTE: there is deliberately NO public /media/ alias.
    # Private files are only served through /api/media/<path>?sig=... (signed, short-lived).
}
