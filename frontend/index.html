<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: با باز شدن کیبوردِ موبایل، ارتفاع چیدمان کوچک می‌شود
         (نه اینکه کیبورد روی فیلد بیفتد)؛ چون html/body اسکرول ندارند، این
         تنظیم باعث می‌شود فیلدهای فرم — مثل رمز صفحه‌ی قفل — همیشه دیده شوند. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#14071a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoveOS" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/app-192.png" />
    <title>LoveOS</title>
    <style>
      /* اسپلش پیش از لود React — مستقل و بدون دارایی بیرونی */
      #loveos-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background:
          radial-gradient(80% 60% at 50% 28%, rgba(247,103,168,.16), transparent 70%),
          radial-gradient(90% 70% at 50% 100%, rgba(150,120,255,.14), transparent 70%),
          linear-gradient(170deg, #1d0c26 0%, #120719 55%, #0a0410 100%);
        color: #fce7f3; font-family: Vazirmatn, system-ui, sans-serif;
        transition: opacity .35s ease;
      }
      #loveos-splash.ls-hide { opacity: 0; pointer-events: none; }
      .ls-heart { animation: loveosBeat 1.2s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(247,103,168,.65)); }
      .ls-name { font-size: 22px; font-weight: 700; letter-spacing: .18em; color: #fff; text-shadow: 0 0 18px rgba(247,103,168,.55); }
      .ls-sub { font-size: 12px; opacity: .65; letter-spacing: .08em; }
      .ls-bar { width: 190px; height: 3px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.1); }
      .ls-bar span { display: block; height: 100%; width: 40%; border-radius: 99px;
        background: linear-gradient(90deg, #ff8cc0, #bba0fb);
        animation: loveosSlide 1.15s ease-in-out infinite; }
      @keyframes loveosBeat { 0%, 100% { transform: scale(1); } 14% { transform: scale(1.16); } 28% { transform: scale(1); } 42% { transform: scale(1.1); } }
      @keyframes loveosSlide {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(360%); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- وقتی React سوار شد کل این بخش با اپ جایگزین می‌شود -->
      <div id="loveos-splash" aria-label="LoveOS loading">
        <svg class="ls-heart" width="72" height="72" viewBox="0 0 64 64" aria-hidden="true">
          <defs>
            <linearGradient id="ls-g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#ff9ecb" />
              <stop offset="55%" stop-color="#f767a8" />
              <stop offset="100%" stop-color="#bba0fb" />
            </linearGradient>
          </defs>
          <rect x="5" y="8" width="54" height="46" rx="14" fill="url(#ls-g)" opacity="0.18" />
          <rect x="5" y="8" width="54" height="46" rx="14" stroke="url(#ls-g)" stroke-width="2.4" fill="none" />
          <circle cx="13" cy="16" r="1.8" fill="#f767a8" />
          <circle cx="19" cy="16" r="1.8" fill="#efc478" />
          <circle cx="25" cy="16" r="1.8" fill="#bba0fb" />
          <!-- قلب + بی‌نهایت - ساختار دقیقاً مشابه آویز نقره‌ای مرجع -->
          <path d="M32 22
           C 24 14, 10 15, 8.5 26
           C 7 36, 17 43, 26 50
           C 26 46.5, 29 42.5, 33 41
           C 36 39.8, 39 40.5, 39 42.8
           C 39 45.1, 36 46, 33.5 44.8
           C 31 43.6, 32.5 40.5, 36 39.5
           C 39.5 38.5, 43 36.8, 45.5 34.2
           C 48 31.6, 48.5 29, 46.5 27.5
           C 44.5 26, 42 27, 42 29.2
           C 42 31.4, 44.5 32.4, 46.5 31.4
           C 48.5 30.4, 48 28, 45.5 27.2
           C 43 26.4, 40.5 28.2, 41.5 30.5
           C 42.5 32.8, 46 31.5, 48.5 29
           C 51 26.5, 50 15.5, 41 13.5
           C 37 12.5, 33.5 14.5, 32 22Z" fill="none" stroke="url(#ls-g)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="ls-name">LoveOS</div>
        <div class="ls-bar"><span></span></div>
        <div class="ls-sub">…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
