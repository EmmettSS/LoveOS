<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: با باز شدن کیبوردِ موبایل، ارتفاع چیدمان کوچک می‌شود
         (نه اینکه کیبورد روی فیلد بیفتد)؛ چون html/body اسکرول ندارند، این
         تنظیم باعث می‌شود فیلدهای فرم — مثل رمز صفحه‌ی قفل — همیشه دیده شوند. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="theme-color" content="#14071a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoveOS" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>LoveOS</title>
    <style>
      /* اسپلش پیش از لود React — مستقل و بدون دارایی بیرونی */
      #loveos-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
        background:
          radial-gradient(80% 60% at 50% 28%, rgba(247,103,168,.16), transparent 70%),
          radial-gradient(90% 70% at 50% 100%, rgba(150,120,255,.14), transparent 70%),
          linear-gradient(170deg, #1d0c26 0%, #120719 55%, #0a0410 100%);
        color: #fce7f3; font-family: Vazirmatn, system-ui, sans-serif;
        transition: opacity .35s ease;
      }
      #loveos-splash.ls-hide { opacity: 0; pointer-events: none; }
      /* نشان تازه: خط اول قلب کشیده می‌شود، بعد ∞ داخلش؛ بعد کل نشان نفس می‌کشد
         و نگین‌های الماس چشمک می‌زنند (draw → pulse). */
      .ls-mark { width: 104px; height: 104px; overflow: visible; filter: drop-shadow(0 0 20px rgba(247,103,168,.55)); }
      .ls-mark path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .ls-draw {
        stroke-dasharray: var(--len);
        stroke-dashoffset: var(--len);
        animation: loveosDraw 1.15s cubic-bezier(.45, 0, .25, 1) var(--d) forwards;
      }
      .ls-a { --len: 1433; --d: 0s; }
      .ls-b { --len: 1357; --d: .8s; }
      .ls-core { stroke: #fff; stroke-opacity: .26; }
      .ls-pulse { transform-box: fill-box; transform-origin: center; animation: loveosPulse 2.6s ease-in-out 2.1s infinite; }
      .ls-sp { opacity: 0; animation: loveosTwinkle 2.6s ease-in-out var(--t) infinite; }
      .ls-name { font-size: 22px; font-weight: 700; letter-spacing: .18em; color: #fff; text-shadow: 0 0 18px rgba(247,103,168,.55); }
      .ls-sub { font-size: 12px; opacity: .65; letter-spacing: .08em; }
      .ls-bar { width: 190px; height: 3px; border-radius: 99px; overflow: hidden; background: rgba(255,255,255,.1); }
      .ls-bar span { display: block; height: 100%; width: 40%; border-radius: 99px;
        background: linear-gradient(90deg, #ff8cc0, #bba0fb);
        animation: loveosSlide 1.15s ease-in-out infinite; }
      @keyframes loveosDraw { to { stroke-dashoffset: 0; } }
      @keyframes loveosPulse {
        0%, 100% { transform: scale(1); }
        12% { transform: scale(1.06); }
        28% { transform: scale(1); }
        42% { transform: scale(1.03); }
      }
      @keyframes loveosTwinkle { 0%, 62%, 100% { opacity: 0; } 10%, 30% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .ls-draw { animation: none; stroke-dashoffset: 0; }
        .ls-pulse, .ls-sp { animation: none; }
        .ls-sp { opacity: .85; }
      }
      @keyframes loveosSlide {
        0% { transform: translateX(-130%); }
        100% { transform: translateX(360%); }
      }
    </style>
